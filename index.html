<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f7;
        }

        header {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        .candidate {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .candidate label {
            font-size: 18px;
            cursor: pointer;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .vote-btn:hover {
            background-color: #218838;
        }

        footer {
            text-align: center;
            background-color: #1e3a5f;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Voting System</h1>
        <p>Cast Your Vote</p>
    </header>

    <div class="container">

        <h2>Select Your Candidate</h2>

        <form>
            <div class="candidate">
                <label>
                    <input type="radio" name="candidate" value="candidate1">
                    Candidate 1 - John
                </label>
            </div>

            <div class="candidate">
                <label>
                    <input type="radio" name="candidate" value="candidate2">
                    Candidate 2 - David
                </label>
            </div>

            <div class="candidate">
                <label>
                    <input type="radio" name="candidate" value="candidate3">
                    Candidate 3 - Alex
                </label>
            </div>

            <div class="candidate">
                <label>
                    <input type="radio" name="candidate" value="candidate4">
                    Candidate 4 - Michael
                </label>
            </div>

            <button type="submit" class="vote-btn">
                Submit Vote
            </button>
        </form>

    </div>

    <footer>
        <p>&copy; 2026 Online Voting System</p>
    </footer>

</body>
</html>
